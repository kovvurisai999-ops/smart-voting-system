services:
  - type: web
    name: smart-voting-system
    env: python
    buildCommand: "python3 -m pip install --upgrade pip && pip install -r requirements.txt && pip uninstall -y opencv-contrib-python opencv-python"
    startCommand: "./.venv/bin/python app.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
