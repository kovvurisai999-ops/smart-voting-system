<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Voting Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Andhra Pradesh Legislative Assembly Election</h1>
        <h2>Identity Authentication</h2>
        
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        
        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="aadhar">Aadhar Number (12 digits)</label>
                <input type="text" id="aadhar" name="aadhar" required placeholder="e.g. 123456789012" pattern="\d{12}">
            </div>
            
            <div class="form-group">
                <label for="voterid">Voter ID</label>
                <input type="text" id="voterid" name="voterid" required placeholder="e.g. ABC1234567">
            </div>
            
            <button type="submit" class="btn">Proceed to Verification</button>
        </form>
        <div style="margin-top: 20px; display: flex; justify-content: center; gap: 20px;">
            <a href="{{ url_for('dashboard') }}" style="color: #666; font-size: 0.9em; text-decoration: none;">Admin Dashboard</a>
            <span style="color: #ccc;">|</span>
            <a href="{{ url_for('check_vote') }}" style="color: #666; font-size: 0.9em; text-decoration: none;">Verify My Cast Vote</a>
            <span style="color: #ccc;">|</span>
            <a href="{{ url_for('register') }}" style="color: #2563eb; font-size: 0.9em; font-weight: 500; text-decoration: none;">New Voter? Register</a>
        </div>
    </div>
</body>
</html>
